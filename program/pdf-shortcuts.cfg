// Firefox AutoConfig ignores this first line. Keep this file UTF-8 without BOM.
// SPDX-License-Identifier: MPL-2.0
(() => {
  // Session-only diagnostic defaults. They are reset at every startup and do
  // not leave a stale success value in the profile's prefs.js.
  const status = value => lockPref("user.pdfShortcuts.status", value);
  lockPref("user.pdfShortcuts.version", "0.7");
  lockPref("user.pdfShortcuts.error", "");
  for (const [key, value] of Object.entries({
    runtime: "starting", connection: "waiting-pdf", lastKey: "", lastRoute: "", lastResult: "",
  })) lockPref("user.pdfShortcuts." + key, value);
  status("starting");
  try {
    const runtime = Cc["@mozilla.org/xre/app-info;1"].getService(Ci.nsIXULRuntime);
    if (runtime.inSafeMode) {
      status("safe-mode");
      return;
    }

    const manifest = Cc["@mozilla.org/file/directory_service;1"]
      .getService(Ci.nsIProperties)
      .get("UChrm", Ci.nsIFile);
    manifest.append("pdf-shortcuts");
    manifest.append("chrome.manifest");
    // Only profiles with the explicitly installed module opt in.
    if (!manifest.exists()) {
      status("missing-manifest");
      return;
    }
    for (const name of ["PdfToolKeysCommon.sys.mjs", "PdfToolKeysChild.sys.mjs", "PdfToolKeysParent.sys.mjs"]) {
      const moduleFile = manifest.parent;
      moduleFile.append(name);
      if (!moduleFile.exists()) {
        status("missing-module");
        lockPref("user.pdfShortcuts.error", "Missing: " + name);
        return;
      }
    }

    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.registerWindowActor("PdfToolKeys", {
      parent: {
        esModuleURI: "resource://pdf-shortcuts/PdfToolKeysParent.sys.mjs?v=0.7",
      },
      child: {
        esModuleURI: "resource://pdf-shortcuts/PdfToolKeysChild.sys.mjs?v=0.7",
        events: {
          DOMContentLoaded: {},
          pageshow: {},
        },
      },
      allFrames: false,
      // Firefox 154+ defaults this to false. PDF tabs run in web/file content
      // processes, where the actor otherwise cannot be instantiated.
      // Both sides check the Firefox-owned PDF principal. The parent accepts
      // readiness/results only; it never executes content-provided commands.
      safeForUntrustedWebProcess: true,
      // A PDF retains its original URL. Both modules validate its Firefox-owned
      // principal rather than trusting a URL suffix or copied toolbar IDs.
    });
    // Import now so a parent module failure cannot masquerade as registered.
    // The versioned URL matches the actor URL and avoids stale module caches.
    ChromeUtils.importESModule(
      "resource://pdf-shortcuts/PdfToolKeysParent.sys.mjs?v=0.7"
    ).startBrowserHooks();
    status("registered");
  } catch (error) {
    status("error");
    lockPref("user.pdfShortcuts.error", String(error));
    try {
      Components.utils.reportError("[PDF shortcuts] Startup failed: " + error);
    } catch {}
  }
})();
